name: Yank crate version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to yank (e.g. 0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  yank:
    name: yank
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo yank --version "${{ inputs.version }}" marlin-binary-transfer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
